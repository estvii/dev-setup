---
- name: Setup macOS
  hosts: localhost
  connection: local
  vars_prompt:
    - name: ansible_become_pass
      prompt: "Enter sudo password"
      private: true
  tasks:
    - name: Install Visual Studio Code
      community.general.homebrew_cask:
        name: visual-studio-code
        state: present
    - name: Install Visual Studio Code extensions
      command: code --install-extension {{ item }}
      loop:
        - dbaeumer.vscode-eslint
        - esbenp.prettier-vscode
        - eamodio.gitlens
        - streetsidesoftware.code-spell-checker
        - editorconfig.editorconfig
        - josa.ember-related-files
        - github.copilot
        - github.copilot-chat
        - shd101wyy.markdown-preview-enhanced
        - arjun.swagger-viewer
        - chakrounanas.turbo-console-log
        - orta.vscode-twoslash-queries
    - name: Install Zsh
      community.general.homebrew:
        name: zsh
        state: present
    - name: Get the path to Zsh
      command: which zsh
      register: zsh_path
    - name: Change default shell to Zsh
      become: true
      command: chsh -s {{ zsh_path.stdout }}
    - name: Install Oh My Zsh
      shell: |
        sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"
      args:
        creates: ~/.oh-my-zsh
    - name: Install zsh autosuggestions
      community.general.homebrew:
        name: zsh-autosuggestions
        state: present
    - name: Activate the autosuggestions plugin
      ansible.builtin.lineinfile:
        path: "~/.zshrc"
        line: 'source $(brew --prefix)/share/zsh-autosuggestions/zsh-autosuggestions.zsh'
        state: present
    - name:  Install aws-cli
      community.general.homebrew:
        name: awscli
        state: present
    - name: Ensure AWS credentials directory exists
      file:
        path: "{{ ansible_env.HOME }}/.aws"
        state: directory
        mode: '0700'
    - name: Check if AWS credentials file exists
      stat:
        path: "{{ ansible_env.HOME }}/.aws/credentials"
      register: credentials_file
    - name: Check if AWS config file exists
      stat:
        path: "{{ ansible_env.HOME }}/.aws/config"
      register: config_file
    - name: Create AWS credentials file if it does not exist
      copy:
        dest: "{{ ansible_env.HOME }}/.aws/credentials"
        content: |
          [default]
          aws_access_key_id = DUMMY_ACCESS_KEY_ID
          aws_secret_access_key = DUMMY_SECRET_ACCESS_KEY
        mode: '0600'
      when: not credentials_file.stat.exists
    - name: Create AWS config file if it does not exist
      copy:
        dest: "{{ ansible_env.HOME }}/.aws/config"
        content: |
          [default]
          region = us-west-2
          output = json
        mode: '0600'
      when: not config_file.stat.exists
    - name: Install Slack
      community.general.homebrew_cask:
        name: slack
        state: present # change to absent to uninstall
    - name: Install google chrome
      community.general.homebrew_cask:
        name: google-chrome
        state: present
    - name: Install 1password
      community.general.homebrew_cask:
        name: 1password
        state: present
    - name: Install Postman
      community.general.homebrew_cask:
        name: postman
        state: present
    - name: Install Hyper terminal
      community.general.homebrew_cask:
        name: hyper
        state: present
    - name: Install AWS VPN Client
      community.general.homebrew_cask:
        name: aws-vpn-client
        state: present
    - name: Install Microsoft-teams
      community.general.homebrew_cask:
        name: microsoft-teams
        state: present
    - name: Install Display link
      community.general.homebrew_cask:
        name: displaylink
        state: present
    - name: Install Volta using Homebrew
      community.general.homebrew:
        name: volta
        state: present
    - name: Tap koekeishiya/formulae # installs repo for yabai
      community.general.homebrew_tap:
        name: koekeishiya/formulae
        state: present
    - name: Install yabai using Homebrew (windows management)
      community.general.homebrew:
        name: koekeishiya/formulae/yabai
        state: present
    - name: Set VOLTA_HOME environment variable in shell startup script # doing this because we're manually installing volta https://docs.volta.sh/guide/getting-started
      ansible.builtin.lineinfile:
        path: "{{ ansible_env.HOME }}/.zshrc"  # or ~/.bashrc or ~/.zshrc
        line: 'export VOLTA_HOME="$HOME/.volta"'
        create: yes
        state: present
    - name: Add Volta to PATH in shell startup script
      ansible.builtin.lineinfile:
        path: "{{ ansible_env.HOME }}/.zshrc"  # or ~/.bashrc or ~/.zshrc
        line: 'export PATH="$VOLTA_HOME/bin:$PATH"'
        create: yes
        state: present
    - name: Check if Node.js is installed
      command: node --version
      register: node_version
      ignore_errors: true
    - name: Use volta to install Node.js if it is not installed
      command: volta install node
      when: node_version.failed

    # This is work specific can be separated out possibly
    # Both these depend on the aws cli setup step and volta setup step
    # TODO maybe add script to ~/.zshrc to run aws-azure-login
    - name: Check if aws-azure-login is installed
      command: which aws-azure-login
      register: aws_azure_login_version
      ignore_errors: true
    - name: Install aws-azure-login using npm
      npm:
        name: aws-azure-login
        global: yes
        state: present
      when: aws_azure_login_version.failed
    - name: Notify user to run aws-azure-login --configure
      debug:
        msg: |
          Please run 'aws-azure-login --configure' to complete the setup.